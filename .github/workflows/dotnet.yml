name: Deploy FruitofLove

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      
      - name: Restore dependencies
        run: dotnet restore FruitofLove
      
      - name: Build
        run: dotnet build FruitofLove --no-restore --configuration Release
      
      - name: Publish FruitofLove
        run: dotnet publish FruitofLove -c Release -o ./publish
      
      - name: Package FruitofLove
        run: tar -czf FruitofLove.tar.gz -C publish .
      
      - name: Deploy to Server
        env:
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          scp -i ~/.ssh/deploy_key FruitofLove.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /var/www/fruitoflove
            sudo systemctl stop fruitoflove || true
            tar -xzf /tmp/FruitofLove.tar.gz -C /var/www/fruitoflove
            sudo systemctl start fruitoflove
            sleep 2
            systemctl is-active fruitoflove && echo "✅ FruitofLove deployed!" || echo "⚠️ Check logs"
            rm /tmp/FruitofLove.tar.gz
          EOF
